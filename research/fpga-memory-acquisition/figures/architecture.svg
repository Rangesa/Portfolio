<text x="680" y="625" text-anchor="middle" class="small">Controlled comparison backend</text>
<line class="arrow" x1="1110" y1="270" x2="1025" y2="365"/>
<line class="arrow" x1="890" y1="417" x2="810" y2="417"/>
<line class="arrow" x1="550" y1="417" x2="470" y2="417"/>
<line class="arrow dash" x1="680" y1="555" x2="680" y2="470"/>
<text x="640" y="700" text-anchor="middle" class="small">Figure 1. Experimental architecture. Dashed path denotes the software baseline used for consistency checks.</text>
